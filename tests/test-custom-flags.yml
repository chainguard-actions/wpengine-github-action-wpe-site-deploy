name: Test custom rsync flags and remote path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with custom FLAGS and REMOTE_PATH (expect failure at SSH stage)
        id: action
        uses: .
        continue-on-error: true
        with:
          WPE_SSHG_KEY_PRIVATE: "INVALID_FAKE_KEY_FOR_TESTING"
          WPE_ENV: "test-env"
          PHP_LINT: "false"
          CACHE_CLEAR: "false"
          SRC_PATH: "."
          REMOTE_PATH: "wp-content/themes/my-theme"
          FLAGS: "-azvr --inplace --exclude=\".*\" --exclude=\"node_modules\""

      - name: Assert action failed (SSH/deploy stage, not input validation)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail (no real WPE credentials), but outcome was ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed at deploy stage with custom FLAGS and REMOTE_PATH accepted"
