---
# Test: action accepts custom FLAGS input for rsync
# Verifies that the action correctly processes custom rsync flags.
# The action will fail at SSH/rsync time with a dummy key, but we verify it starts.
name: Test custom rsync flags
on:
  workflow_dispatch:
jobs:
  test-custom-flags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: deploy
        name: Run action with custom FLAGS
        uses: .
        continue-on-error: true
        with:
          WPE_SSHG_KEY_PRIVATE: "INVALID_DUMMY_KEY_NOT_REAL"
          WPE_ENV: "test-fake-env-12345"
          FLAGS: '-azvr --inplace --exclude=".*" --exclude="node_modules"'
          PHP_LINT: "false"
          CACHE_CLEAR: "false"

      - name: Assert action ran with custom flags (failed at SSH as expected)
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of invalid SSH key.
          # It should NOT be skipped (which would indicate a configuration error).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly - possible FLAGS input error"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid SSH key, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly processed custom FLAGS input and failed at SSH (outcome=$OUTCOME)"
