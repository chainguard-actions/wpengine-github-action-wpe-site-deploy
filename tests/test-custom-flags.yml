name: Test custom FLAGS and REMOTE_PATH inputs
on:
  workflow_dispatch:
jobs:
  test-custom-flags:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate dummy RSA key for testing
        id: gen-key
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" -q
          PRIVATE_KEY=$(cat /tmp/test_key)
          echo "PRIVATE_KEY<<EOF" >> $GITHUB_OUTPUT
          echo "$PRIVATE_KEY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run action with custom FLAGS and REMOTE_PATH
        id: action
        uses: .
        continue-on-error: true
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ steps.gen-key.outputs.PRIVATE_KEY }}
          WPE_ENV: test-env-placeholder
          FLAGS: '-azvr --inplace --exclude=".*" --exclude="node_modules"'
          REMOTE_PATH: "wp-content/themes/my-theme"
          SRC_PATH: "."
          PHP_LINT: "false"
          CACHE_CLEAR: "true"

      - name: Assert action ran with custom flags
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with custom FLAGS and REMOTE_PATH (outcome=$OUTCOME)"
