---
# Test: action accepts SRC_PATH and REMOTE_PATH inputs
# Verifies that the action correctly processes custom source and remote path inputs.
# The action will fail at SSH/rsync time with a dummy key, but we verify it starts.
name: Test custom source and remote paths
on:
  workflow_dispatch:
jobs:
  test-custom-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a custom source directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/wp-content/themes/my-theme"
          echo "/* My Theme */" > "$GITHUB_WORKSPACE/wp-content/themes/my-theme/style.css"

      - id: deploy
        name: Run action with custom SRC_PATH and REMOTE_PATH
        uses: .
        continue-on-error: true
        with:
          WPE_SSHG_KEY_PRIVATE: "INVALID_DUMMY_KEY_NOT_REAL"
          WPE_ENV: "test-fake-env-12345"
          SRC_PATH: "wp-content/themes/my-theme"
          REMOTE_PATH: "wp-content/themes/my-theme"
          PHP_LINT: "false"
          CACHE_CLEAR: "false"

      - name: Assert action ran (failed at SSH, not at input processing)
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of invalid SSH key.
          # It should NOT be skipped (which would indicate a configuration error).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly - possible input configuration error"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid SSH key, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly processed SRC_PATH and REMOTE_PATH inputs and failed at SSH (outcome=$OUTCOME)"
