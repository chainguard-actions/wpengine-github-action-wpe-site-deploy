---
# Test: action accepts PHP_LINT=true input and processes it
# The Docker action will attempt PHP syntax checking when PHP_LINT=true.
# With a dummy SSH key and fake environment, it will fail at SSH/rsync time,
# but we verify the action starts and processes the PHP_LINT flag.
name: Test PHP lint enabled
on:
  workflow_dispatch:
jobs:
  test-php-lint-enabled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a sample PHP file for lint checking
        run: |
          cat > "$GITHUB_WORKSPACE/index.php" << 'EOF'
          <?php
          echo "Hello, World!";
          ?>
          EOF

      - id: deploy
        name: Run action with PHP_LINT=true
        uses: .
        continue-on-error: true
        with:
          WPE_SSHG_KEY_PRIVATE: "INVALID_DUMMY_KEY_NOT_REAL"
          WPE_ENV: "test-fake-env-12345"
          PHP_LINT: "true"
          CACHE_CLEAR: "false"

      - name: Assert action failed (expected - invalid SSH key, not PHP lint error)
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of invalid SSH key, not because of PHP lint
          # (the PHP file we created is valid). Either failure or success is acceptable
          # as long as the action ran (i.e., it didn't crash before processing inputs).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran and processed PHP_LINT=true input (outcome=$OUTCOME)"
