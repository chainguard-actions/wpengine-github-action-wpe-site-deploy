name: Test deploy with DEV_ENV
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          WPE_SSHG_KEY_PRIVATE: "fake-private-key-for-testing"
          DEV_ENV: "mysite-dev"
          PHP_LINT: "false"
          CACHE_CLEAR: "false"
          FLAGS: '-azvr --inplace --exclude=".*"'
          SRC_PATH: "."
          REMOTE_PATH: ""
      - name: Assert action ran (expected to fail due to invalid SSH key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
