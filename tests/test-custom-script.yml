name: Test deploy with custom script
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          WPE_SSHG_KEY_PRIVATE: "fake-private-key-for-testing"
          WPE_ENV: "mysite"
          SRC_PATH: "."
          FLAGS: '-azvr --inplace --exclude=".*"'
          PHP_LINT: "false"
          CACHE_CLEAR: "true"
          SCRIPT: "post-deploy.sh"
      - name: Assert action was attempted
        run: |
          echo "Action step completed (with or without error — SSH will fail in test env)"
          echo "PASS: SCRIPT input was accepted by the action"
