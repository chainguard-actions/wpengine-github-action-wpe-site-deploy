name: Test PHP lint flag
on:
  workflow_dispatch:
jobs:
  test-php-lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate dummy RSA key for testing
        id: gen-key
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" -q
          PRIVATE_KEY=$(cat /tmp/test_key)
          echo "PRIVATE_KEY<<EOF" >> $GITHUB_OUTPUT
          echo "$PRIVATE_KEY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run action with PHP_LINT enabled
        id: action
        uses: .
        continue-on-error: true
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ steps.gen-key.outputs.PRIVATE_KEY }}
          WPE_ENV: test-env-placeholder
          PHP_LINT: "true"
          CACHE_CLEAR: "false"
          SRC_PATH: "."

      - name: Assert action ran with PHP_LINT flag
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail (SSH will not connect to a real WPE env)
          # but it should NOT be skipped — it must have actually run
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with PHP_LINT=true (outcome=$OUTCOME)"
