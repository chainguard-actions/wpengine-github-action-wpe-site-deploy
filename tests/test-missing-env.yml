name: Test missing WPE environment handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with no WPE environment specified (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          WPE_SSHG_KEY_PRIVATE: "INVALID_FAKE_KEY_FOR_TESTING"
          PHP_LINT: "false"
          CACHE_CLEAR: "false"
          SRC_PATH: "."
          # No WPE_ENV, PRD_ENV, STG_ENV, or DEV_ENV provided

      - name: Assert action failed due to missing environment
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with no WPE environment, but outcome was ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with no WPE environment specified"
