name: Test legacy PRD_ENV destination
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare source directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/deploy-src"
          echo "<?php echo 'hello';" > "$GITHUB_WORKSPACE/deploy-src/index.php"
      - id: action
        uses: .
        continue-on-error: true
        with:
          WPE_SSHG_KEY_PRIVATE: "invalid-private-key-content"
          PRD_ENV: "actionchainnonexistentprd"
          SRC_PATH: "deploy-src"
          CACHE_CLEAR: "false"
      - name: Assert deployment failed (no real credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with an invalid SSH key"
            exit 1
          fi
          echo "PASS"
