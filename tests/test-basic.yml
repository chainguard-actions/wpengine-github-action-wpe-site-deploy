name: Test basic deploy with WPE_ENV
on:
  workflow_dispatch:
jobs:
  test-basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action (expect failure - no real SSH key or WPE environment)
        id: action
        uses: .
        continue-on-error: true
        with:
          WPE_SSHG_KEY_PRIVATE: "fake-private-key-for-testing"
          WPE_ENV: "mysite"
          FLAGS: '-azvr --inplace --exclude=".*"'
          CACHE_CLEAR: "false"
          SRC_PATH: "."

      - name: Assert action ran (failed due to SSH, not missing config)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the SSH key is invalid / WPE is unreachable,
          # not because of missing required inputs. Any outcome (success or failure) is
          # acceptable here — we just verify the step was reached and the action started.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
