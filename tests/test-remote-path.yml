name: Test remote path option fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with REMOTE_PATH set (expect failure - no real WPE credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          WPE_SSHG_KEY_PRIVATE: "INVALID_KEY_FOR_TESTING"
          WPE_ENV: "test-env"
          REMOTE_PATH: "wp-content/themes/my-theme"
          PHP_LINT: "false"
          CACHE_CLEAR: "false"
          SRC_PATH: "."

      - name: Assert action failed (no real WPE credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without real WPE credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without real WPE credentials"
