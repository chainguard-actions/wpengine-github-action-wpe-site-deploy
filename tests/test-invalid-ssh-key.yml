---
# Test: action fails gracefully when given an invalid SSH key
# The Docker action will attempt to set up SSH and connect to WP Engine.
# With a dummy key and a fake environment name, it should fail at SSH/rsync time.
# We assert that the action step itself fails (outcome == failure).
name: Test invalid SSH key fails gracefully
on:
  workflow_dispatch:
jobs:
  test-invalid-ssh-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: deploy
        name: Run action with invalid SSH key
        uses: .
        continue-on-error: true
        with:
          WPE_SSHG_KEY_PRIVATE: "INVALID_DUMMY_KEY_NOT_REAL"
          WPE_ENV: "test-fake-env-12345"
          PHP_LINT: "false"
          CACHE_CLEAR: "false"

      - name: Assert action failed due to invalid SSH key
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid SSH key, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid SSH key"
