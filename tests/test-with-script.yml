name: Test deployment with SCRIPT input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        continue-on-error: true
        uses: .
        with:
          WPE_SSHG_KEY_PRIVATE: "fake-private-key-for-testing"
          WPE_ENV: "mysite"
          SRC_PATH: "."
          REMOTE_PATH: "wp-content/themes/mytheme"
          FLAGS: '-azvr --inplace --exclude=".*"'
          PHP_LINT: true
          CACHE_CLEAR: true
          SCRIPT: "deploy-scripts/post-deploy.sh"
      - name: Assert action ran (expected to fail due to invalid SSH key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with expected outcome"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS"
