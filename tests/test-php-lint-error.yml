name: Test PHP lint with syntax error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare source with a PHP syntax error
        run: |
          mkdir -p "$GITHUB_WORKSPACE/lint-src"
          printf '<?php\nfunction broken( {\n' > "$GITHUB_WORKSPACE/lint-src/broken.php"
      - id: action
        uses: .
        continue-on-error: true
        with:
          WPE_SSHG_KEY_PRIVATE: "invalid-private-key-content"
          WPE_ENV: "actionchainnonexistentenv"
          SRC_PATH: "lint-src"
          PHP_LINT: "true"
          CACHE_CLEAR: "false"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure (PHP syntax error / no valid credentials)"
            exit 1
          fi
          echo "PASS"
