name: Test post-deploy SCRIPT input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare source directory and script
        run: |
          mkdir -p "$GITHUB_WORKSPACE/deploy-src"
          echo "<?php echo 'hello';" > "$GITHUB_WORKSPACE/deploy-src/index.php"
          printf '#!/bin/sh\necho "post-deploy script ran"\n' > "$GITHUB_WORKSPACE/deploy-src/post-deploy.sh"
      - id: action
        uses: .
        continue-on-error: true
        with:
          WPE_SSHG_KEY_PRIVATE: "invalid-private-key-content"
          WPE_ENV: "actionchainnonexistentenv"
          SRC_PATH: "deploy-src"
          SCRIPT: "deploy-src/post-deploy.sh"
          CACHE_CLEAR: "false"
      - name: Assert deployment failed (no real credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with an invalid SSH key"
            exit 1
          fi
          echo "PASS"
