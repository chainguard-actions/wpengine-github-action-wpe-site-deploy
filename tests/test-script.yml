name: Test deploy with SCRIPT
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          WPE_SSHG_KEY_PRIVATE: "fake-private-key-for-testing"
          WPE_ENV: "mysite"
          SRC_PATH: "."
          FLAGS: '-azvr --inplace --exclude=".*"'
          PHP_LINT: "false"
          CACHE_CLEAR: "true"
          SCRIPT: "post-deploy.sh"
          REMOTE_PATH: "wp-content/themes/mytheme"
      - name: Assert action ran (may fail due to no real SSH key)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step was reached and executed"
