name: Test multi-environment inputs (PRD/STG/DEV)
on:
  workflow_dispatch:
jobs:
  test-multi-env:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate dummy RSA key for testing
        id: gen-key
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" -q
          PRIVATE_KEY=$(cat /tmp/test_key)
          echo "PRIVATE_KEY<<EOF" >> $GITHUB_OUTPUT
          echo "$PRIVATE_KEY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run action with PRD_ENV input
        id: action-prd
        uses: .
        continue-on-error: true
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ steps.gen-key.outputs.PRIVATE_KEY }}
          PRD_ENV: test-prd-placeholder
          PHP_LINT: "false"
          CACHE_CLEAR: "false"
          SRC_PATH: "."

      - name: Assert PRD_ENV action ran
        env:
          OUTCOME: ${{ steps.action-prd.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with PRD_ENV (outcome=$OUTCOME)"

      - name: Run action with STG_ENV input
        id: action-stg
        uses: .
        continue-on-error: true
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ steps.gen-key.outputs.PRIVATE_KEY }}
          STG_ENV: test-stg-placeholder
          PHP_LINT: "false"
          CACHE_CLEAR: "false"
          SRC_PATH: "."

      - name: Assert STG_ENV action ran
        env:
          OUTCOME: ${{ steps.action-stg.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with STG_ENV (outcome=$OUTCOME)"
