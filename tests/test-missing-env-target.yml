---
# Test: action fails when no WPE environment target is specified
# The Docker action requires at least one of WPE_ENV, PRD_ENV, STG_ENV, or DEV_ENV.
# Without a target environment, the action should fail.
name: Test missing environment target fails
on:
  workflow_dispatch:
jobs:
  test-missing-env-target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: deploy
        name: Run action with no environment target
        uses: .
        continue-on-error: true
        with:
          WPE_SSHG_KEY_PRIVATE: "INVALID_DUMMY_KEY_NOT_REAL"
          # Intentionally omitting WPE_ENV, PRD_ENV, STG_ENV, DEV_ENV

      - name: Assert action failed due to missing environment target
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with no environment target, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with no environment target"
