name: Test basic deploy with WPE_ENV
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          WPE_SSHG_KEY_PRIVATE: "fake-private-key-for-testing"
          WPE_ENV: "mysite"
          PHP_LINT: "false"
          CACHE_CLEAR: "false"
          SRC_PATH: "."
          REMOTE_PATH: ""
          FLAGS: '-azvr --inplace --exclude=".*"'
      - name: Assert action ran (may fail due to no real SSH key)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step was reached and executed"
