name: Test DEV_ENV and SCRIPT deployment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          WPE_SSHG_KEY_PRIVATE: "fake-private-key-for-testing"
          DEV_ENV: "mysite-dev"
          SCRIPT: "deploy-scripts/post-deploy.sh"
          PHP_LINT: "false"
          CACHE_CLEAR: "false"
          FLAGS: '-azvr --inplace --exclude=".*"'
          SRC_PATH: "."
          REMOTE_PATH: ""
      - name: Assert action ran (connection failure is expected)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail because we are not providing a real SSH key
          # or a real WP Engine environment. We just verify it ran (not skipped).
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran as expected"
