name: Test environment-specific deploy inputs
on:
  workflow_dispatch:
jobs:
  test-prd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action-prd
        uses: .
        continue-on-error: true
        with:
          WPE_SSHG_KEY_PRIVATE: "fake-private-key-for-testing"
          PRD_ENV: "mysite-prd"
          STG_ENV: "mysite-stg"
          DEV_ENV: "mysite-dev"
          SRC_PATH: "."
          FLAGS: '-azvr --inplace --exclude=".*"'
          PHP_LINT: "false"
          CACHE_CLEAR: "true"
      - name: Assert action was attempted
        run: |
          echo "Action step completed (with or without error — SSH will fail in test env)"
          echo "PASS: PRD_ENV, STG_ENV, DEV_ENV inputs were accepted by the action"
